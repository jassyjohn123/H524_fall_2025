<svg width="400" height="300" xmlns="http://www.w3.org/2000/svg">
  <!-- Histogram of FEV1 data -->
  <rect x="40" y="240" width="300" height="2" fill="black"/>
  <rect x="40" y="40" width="2" height="200" fill="black"/>
  <!-- Bars -->
  <rect x="60" y="180" width="40" height="60" fill="#69b7ff" stroke="black"/>
  <rect x="100" y="140" width="40" height="100" fill="#69b7ff" stroke="black"/>
  <rect x="140" y="100" width="40" height="140" fill="#69b7ff" stroke="black"/>
  <rect x="180" y="160" width="40" height="80" fill="#69b7ff" stroke="black"/>
  <rect x="220" y="200" width="40" height="40" fill="#69b7ff" stroke="black"/>
  <!-- Axis labels -->
  <text x="80" y="260" font-family="Arial" font-size="12" text-anchor="middle">2.0</text>
  <text x="120" y="260" font-family="Arial" font-size="12" text-anchor="middle">2.5</text>
  <text x="160" y="260" font-family="Arial" font-size="12" text-anchor="middle">3.0</text>
  <text x="200" y="260" font-family="Arial" font-size="12" text-anchor="middle">3.5</text>
  <text x="240" y="260" font-family="Arial" font-size="12" text-anchor="middle">4.0</text>
  <text x="200" y="285" font-family="Arial" font-size="14" text-anchor="middle">FEV1 (liters)</text>
  <text x="20" y="140" font-family="Arial" font-size="14" text-anchor="middle" transform="rotate(-90 20 140)">Frequency</text>
  <text x="200" y="30" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle">FEV1 Distribution (n=13)</text>
</svg>